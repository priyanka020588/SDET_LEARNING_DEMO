name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly 11:30pm IST (18:00 UTC). GitHub pauses this if the repo is idle for 60 days.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Which TestNG suite to run
        type: choice
        options:
          - smoke
          - regression
        default: smoke

jobs:
  test:
    name: ${{ github.event_name == 'schedule' && 'regression' || inputs.suite || 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Choose suite
        id: suite
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "name=regression" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.suite }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=smoke" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ${{ steps.suite.outputs.name }} suite
        run: ./mvnw -B test -DsuiteXmlFile=src/test/resources/suites/${{ steps.suite.outputs.name }}.xml -Dheadless=true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.suite.outputs.name }}-reports
          path: |
            reports/
            logs/
            target/surefire-reports/
          if-no-files-found: warn

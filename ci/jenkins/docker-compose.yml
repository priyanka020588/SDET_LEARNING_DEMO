services:
  jenkins:
    build: .
    image: sdet-jenkins:local
    container_name: sdet-jenkins
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: "-Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true"
      CHROME_BIN: /usr/lib/chromium/chromium
      CHROMEDRIVER: /usr/bin/chromedriver
      JAVA_TOOL_OPTIONS: "-Dwebdriver.chrome.driver=/usr/bin/chromedriver"
    # The socket is root:root mode 660 inside the container. Group 0 lets the
    # jenkins user talk to the host Docker engine.
    group_add:
      - "0"
    volumes:
      - sdet-jenkins-home:/var/jenkins_home
      - ../..:/workspace/repo
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  sdet-jenkins-home:
    name: sdet-jenkins-home
    external: true
